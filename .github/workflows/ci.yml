name: PHASE-ZERO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero explicit any)
        run: npm run lint

      - name: Typecheck (strict: true)
        run: npm run typecheck

      - name: Run unit & parity tests (Vitest)
        run: npm test

      - name: Build all workspaces
        run: npm run build

