apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: phasezero-app
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: phasezero-app-auth
  timeout: 60s
  url: ssh://git@github.com/Smolakjc/phase-zero-app.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phasezero-app
  namespace: flux-system
spec:
  interval: 1m
  path: ./deployment/rubix
  prune: true
  sourceRef:
    kind: GitRepository
    name: phasezero-app
