<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Padrão Map-First Moderno — PHASE-ZERO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #FFFFFF; color: #0F172A; font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .layout { position: relative; width: 1440px; height: 900px; background: #E2E8F0; }
  .search-card { position: absolute; top: 20px; left: 20px; width: 380px; background: #FFFFFF; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(15,23,42,0.12); }
  .search-card input { width: 100%; padding: 9px 12px; border: 1px solid #CBD5E1; border-radius: 8px; margin-top: 10px; font-size: 13px; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { padding: 5px 9px; border-radius: 6px; background: #F1F5F9; font-size: 11px; font-weight: 600; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: #FFFFFF; border-left: 1px solid #E2E8F0; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: -8px 0 28px rgba(15,23,42,0.08); }
  .box { border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px; background: #F8FAFC; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
</style>
</head>
<body>
<div class="layout">
  <div class="search-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong style="font-size:15px;">PHASE-ZERO</strong>
      <span style="font-size:11px;color:#2563EB;font-weight:600;">Claro / Escuro</span>
    </div>
    <input value="Buscar barragem ou coordenada..." readonly>
    <div class="chips">
      <span class="chip">Itaipu</span>
      <span class="chip" style="background:#DBEAFE;color:#1D4ED8;">Gongo Soco</span>
      <span class="chip">Maceió</span>
      <span class="chip">Brumadinho</span>
    </div>
  </div>
  <div style="position:absolute;left:520px;top:400px;width:18px;height:18px;border-radius:99px;background:#F59E0B;border:3px solid #FFFFFF;box-shadow:0 0 0 6px rgba(37,99,235,0.22);"></div>
  <aside class="drawer">
    <div>
      <span style="font-size:11px;font-weight:700;color:#B45309;">YELLOW · ATENÇÃO</span>
      <h2 style="font-size:18px;margin-top:4px;">Barragem Sul Superior</h2>
      <span class="mono" style="font-size:11px;color:#64748B;">-19.9419, -43.5997</span>
    </div>
    <div class="kpis">
      <div class="box"><span style="font-size:10px;color:#64748B;">Tendência</span><div class="mono" style="font-weight:700;">-2.4 mm</div></div>
      <div class="box"><span style="font-size:10px;color:#64748B;">Aceleração</span><div class="mono" style="font-weight:700;">4.1 mm</div></div>
      <div class="box"><span style="font-size:10px;color:#64748B;">Score</span><div class="mono" style="font-weight:700;">3.28 σ</div></div>
    </div>
    <div class="box" style="height:170px;">Malha 3D Topográfica</div>
    <div class="box" style="flex:1;">Gráfico de Deconvolução Temporal</div>
  </aside>
</div>
</body>
</html>
